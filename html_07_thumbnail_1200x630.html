<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>썸네일 - SK이터닉스 KKR 매각</title>
<meta property="og:title" content="SK이터닉스, KKR 품에 안기다" />
<meta property="og:description" content="SK디스커버리·한앤컴퍼니 지분 43.5%, 3,479억원에 KKR로. 지분매각부터 고용승계, 신재생 홀드코까지 완전분석." />
<meta property="og:image" content="이 카드를 PNG로 캡처한 뒤 업로드한 이미지 URL을 여기에 입력하세요" />
<meta property="og:url" content="페이지 URL을 여기에 입력하세요" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
<style>
  html,body{margin:0;padding:0;background:#EDEFF4;}
  .thumb {
    width:1200px; height:630px; position:relative; overflow:hidden;
    font-family:'Pretendard','Noto Sans CJK KR','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    background: radial-gradient(circle at 82% 18%, #16345E 0%, #0B2545 46%, #071730 100%);
    margin: 0 auto;
  }
  .thumb .glow1{position:absolute; width:520px;height:520px;border-radius:50%; background:rgba(214,0,28,0.28); filter:blur(60px); top:-160px; right:-140px;}
  .thumb .glow2{position:absolute; width:420px;height:420px;border-radius:50%; background:rgba(30,142,107,0.22); filter:blur(70px); bottom:-140px; left:-100px;}

  .thumb .eyebrow {
    position:absolute; top:64px; left:70px; color:#FFC94D; font-size:18px; font-weight:800;
    letter-spacing:.18em; text-transform:uppercase;
  }
  .thumb h1 {
    position:absolute; top:96px; left:70px; right:70px; color:#fff; font-size:58px; font-weight:900;
    line-height:1.28; margin:0; max-width:900px;
  }
  .thumb h1 span { color:#FF7A85; }
  .thumb .sub {
    position:absolute; top:302px; left:70px; color:#C9D4E6; font-size:22px; font-weight:600;
  }

  .thumb .chips { position:absolute; top:360px; left:70px; display:flex; gap:12px; }
  .thumb .chip {
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.28); color:#fff;
    font-size:16px; font-weight:700; padding:9px 18px; border-radius:999px;
  }
  .thumb .chip.gold{ background:rgba(255,201,77,0.16); border-color:rgba(255,201,77,0.5); color:#FFC94D; }

  .thumb .statrow { position:absolute; bottom:56px; left:70px; right:70px; display:flex; gap:18px; }
  .thumb .stat { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); border-radius:16px; padding:16px 22px; flex:1; }
  .thumb .stat .v { color:#fff; font-size:28px; font-weight:900; }
  .thumb .stat .l { color:#9FB0CB; font-size:13.5px; font-weight:600; margin-top:2px; }

  .thumb .brandmark {
    position:absolute; top:64px; right:70px; display:flex; align-items:center; gap:10px;
  }
  .thumb .brandmark .k { background:#fff; color:#0B2545; font-weight:900; font-size:20px; border-radius:10px; padding:8px 14px; }
  .thumb .brandmark .arrow { color:#FFC94D; font-size:24px; font-weight:900; line-height:1; }
  .thumb .brandmark .s { color:#fff; font-weight:800; font-size:20px; border:2px solid rgba(255,255,255,.5); border-radius:10px; padding:6px 12px; }
</style>
</head>
<body>
  <div class="thumb">
    <div class="glow1"></div><div class="glow2"></div>
    <div class="eyebrow">DEEP-DIVE REPORT</div>
    <h1>SK이터닉스,<br/>KKR 품에 <span>안기다</span></h1>
    <div class="sub">지분매각 · 고용승계 · 신재생 홀드코까지 완전분석</div>
    <div class="chips">
      <div class="chip">#SK이터닉스</div>
      <div class="chip">#SK디스커버리</div>
      <div class="chip gold">#KKR</div>
    </div>
    <div class="brandmark">
      <div class="s">SK</div>
      <span class="arrow" aria-hidden="true">&#8594;</span>
      <div class="k">KKR</div>
    </div>
    <div class="statrow">
      <div class="stat"><div class="v">43.50%</div><div class="l">매각 지분율</div></div>
      <div class="stat"><div class="v">3,479억</div><div class="l">총 거래대금</div></div>
      <div class="stat"><div class="v">1.8조</div><div class="l">신재생 홀드코 패키지</div></div>
    </div>
  </div>
</body>
</html>
